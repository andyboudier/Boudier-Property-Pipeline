[project]
name = "freehold-etl"
version = "0.1.0"
description = "Builds freehold_candidates for the Unbroken Freehold Finder"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "shapely>=2.0",
  "pyproj>=3.6",
  "lxml>=5.2",          # INSPIRE GML
  "pandas>=2.2",
  "python-dotenv>=1.0",
]

[tool.uv]
dev-dependencies = ["pytest>=8", "ruff>=0.6"]
